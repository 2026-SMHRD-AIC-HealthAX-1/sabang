<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fram Vision - 대시보드</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/dashboard.css">
    <link rel="stylesheet" href="../CSS/anomaly.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body data-page="dashboard">
<div id="header"></div>
<div class="layout">
    <div id="sidebar"></div>
    <main class="main">
        <div class="dashboard-content">

            <section class="card dash-card" aria-labelledby="dash-alerts-title">
                <div class="card-title">
                    <span id="dash-alerts-title"><i class="fa-solid fa-bell" aria-hidden="true"></i> <span data-i18n="dashPendingAlertsTitle">미처리 알림</span></span>
                    <a href="alerts.html" class="dash-card-link admin-only-inline" data-i18n="dashViewAllLink">전체보기</a>
                </div>
                <div class="dash-alert-summary" id="dashAlertSummary"></div>
                <ul class="dash-list" id="dashAlertList"></ul>
            </section>

            <section class="card dash-card" aria-labelledby="dash-slip-title">
                <div class="card-title">
                    <span id="dash-slip-title"><i class="fa-solid fa-file-lines" aria-hidden="true"></i> <span data-i18n="dashRecentSlipTitle">최근 전표</span></span>
                    <a href="receipts.html" class="dash-card-link" data-i18n="dashViewAllLink">전체보기</a>
                </div>
                <div class="dash-slip-body" id="dashSlipBody"></div>
            </section>

            <section class="card dash-card" aria-labelledby="dash-camera-title">
                <div class="card-title">
                    <span id="dash-camera-title"><i class="fa-solid fa-video" aria-hidden="true"></i> <span data-i18n="dashCameraStatusTitle">실시간 카메라</span></span>
                    <a href="monitoring.html" class="dash-card-link" data-i18n="dashViewAllLink">전체보기</a>
                </div>
                <div class="dash-camera-body" id="dashCameraBody"></div>
            </section>

            <section class="card dash-card" aria-labelledby="dash-outbound-title">
                <div class="card-title">
                    <span id="dash-outbound-title"><i class="fa-solid fa-truck-fast" aria-hidden="true"></i> <span data-i18n="dashOutboundTodayTitle">오늘 출고 현황</span></span>
                    <a href="analytics.html" class="dash-card-link" data-i18n="dashViewAllLink">전체보기</a>
                </div>
                <div class="dash-outbound-summary" id="dashOutboundSummary"></div>
                <div class="dash-outbound-body" id="dashOutboundBody">
                    <div class="dash-chart-box"><canvas id="dashOutboundChart"></canvas></div>
                </div>
            </section>

        </div>
    </main>
</div>
<script src="../js/common.js"></script>
<script src="../js/anomaly-ui.js"></script>
<script src="../js/dashboard.js"></script>
</body>
</html>
