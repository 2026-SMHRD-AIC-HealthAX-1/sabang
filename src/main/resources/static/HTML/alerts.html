<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <title>이상 알림</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="../CSS/style.css">

    <link rel="stylesheet" href="../CSS/anomaly.css">
    <script src="../js/admin-guard.js"></script>
</head>


<body data-page="alerts">

    <div id="header"></div>

    <div class="layout">

        <div id="sidebar"></div>


        <main class="main">

            <!-- <div class="page-header">

                <h1 data-i18n="alertsTitle">🔔 이상 알림</h1>

                <p data-i18n="alertsDescription">
                    AI가 감지한 재고 이상 및 전표 불일치 내역입니다.
                </p>

            </div> -->


            <div class="alert-grid">

                <section class="card alert-card anomaly-history" aria-labelledby="mismatch-alert-title">
                    <div class="card-title alert-card-title">
                        <span id="mismatch-alert-title"><i class="fa-solid fa-file-circle-exclamation"></i> <span data-i18n="mismatchAlertTitle">전표·세그먼트 불일치</span></span>
                        <small id="anomaly-count">누적 0건</small>
                    </div>
                    <p class="alert-card-description" data-i18n="mismatchAlertDescription">전표의 요청 수량과 세그먼트 인식 수량이 다른 내역입니다.</p>
                    <div class="alert-table-wrap">
                        <table><thead><tr><th data-i18n="colTime">시간</th><th data-i18n="colMedicine">의약품</th><th data-i18n="colMismatchDetail">불일치 내용</th><th data-i18n="colProcessStatus">처리상태</th></tr></thead><tbody id="anomaly-rows"></tbody></table>
                    </div>
                </section>

                <section class="card alert-card inventory-history" aria-labelledby="inventory-alert-title">
                    <div class="card-title alert-card-title">
                        <span id="inventory-alert-title"><i class="fa-solid fa-box-open"></i> <span data-i18n="inventoryAlertTitle">카메라 재고 부족</span></span>
                        <small id="inventory-alert-count">누적 0건</small>
                    </div>
                    <p class="alert-card-description" data-i18n="inventoryAlertDescription">카메라에서 확인된 재고가 설정된 최소 수량 이하인 내역입니다.</p>
                    <div class="alert-table-wrap">
                        <table><thead><tr><th data-i18n="colTime">시간</th><th data-i18n="colMedicine">의약품</th><th data-i18n="colInventoryStatus">재고 현황</th><th data-i18n="colProcessStatus">처리상태</th></tr></thead><tbody id="inventory-alert-rows"></tbody></table>
                    </div>
                </section>

            </div>

        </main>

    </div>

    <script src="../js/common.js"></script>

    <script src="../js/anomaly-store.js"></script>
    <script src="../js/anomaly-ui.js"></script>
</body>

</html>
