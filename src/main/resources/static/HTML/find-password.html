<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fram Vision - 비밀번호 찾기</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="../CSS/login.css">
</head>

<body>

<header>

    <a href="index.html" class="logo">

        <div class="logo-icon">
            <i class="fa-solid fa-plus"></i>
        </div>

        <div>
            <h2>Fram <span>Vision</span></h2>
            <p>AI로 지키는 안전한 의료</p>
        </div>

    </a>

    <div class="header-right">
        <a href="login.html">로그인으로 돌아가기</a>
    </div>

</header>


<main class="page find-page">

    <section class="form-area">

        <div class="login-card">

            <h2>비밀번호 찾기</h2>

            <p>
                아이디와 가입하신 이메일, 전화번호를 입력하시면<br>
                본인 확인 후 비밀번호를 재설정할 수 있습니다.
            </p>


            <form id="findPasswordForm">

                <div class="input-box">

                    <i class="fa-regular fa-id-badge"></i>

                    <input
                        type="text"
                        id="memberId"
                        placeholder="아이디를 입력하세요"
                        required>

                </div>


                <div class="input-box">

                    <i class="fa-regular fa-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        placeholder="이메일을 입력하세요"
                        required>

                </div>


                <div class="input-box">

                    <i class="fa-solid fa-phone"></i>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="전화번호를 입력하세요 ('-' 없이)"
                        required>

                </div>


                <button class="login-btn" type="submit">
                    본인 확인
                </button>

                <div id="message" class="message"></div>

            </form>


            <div class="bottom-link">
                아이디가 기억나지 않으신가요?
                <a href="find-id.html">아이디 찾기</a>
            </div>

        </div>

    </section>

</main>


<script src="../js/find-password.js"></script>

</body>
</html>
