<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <title>통계 분석</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="../CSS/style.css">

    <link rel="stylesheet" href="../CSS/analytics.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

</head>


<body data-page="analytics">

    <div id="header"></div>

    <div class="layout">

        <div id="sidebar"></div>


        <main class="main">

            <!-- <div class="page-header">

                <h1 data-i18n="analyticsTitle">📊 통계 분석</h1>

                <p data-i18n="analyticsDescription">
                    입·출고 및 이상 감지 데이터를 분석합니다.
                </p>

            </div> -->


            <!--
                엑셀 피벗테이블처럼 항목을 여러 개 동시에 체크해서 조합할 수 있게 한다.
                통계 항목은 회의 내용에 따라 앞으로 바뀔 수 있어서, 집계 로직은
                analytics.js에서 원본 데이터를 받아 체크된 조합대로 그때그때 계산한다.
            -->

            <div class="analytics-filters">

                <div class="filter-group">

                    <span class="filter-label" data-i18n="filterSelectLabel">항목 선택 (여러 개 선택 가능)</span>

                    <label class="filter-check">
                        <input type="checkbox" data-dimension="wardName" checked>
                        <span data-i18n="filterWard">병동</span>
                    </label>

                    <label class="filter-check">
                        <input type="checkbox" data-dimension="medicineName" checked>
                        <span data-i18n="filterMedicine">의약품</span>
                    </label>

                    <label class="filter-check">
                        <input type="checkbox" data-dimension="day">
                        <span data-i18n="filterDay">일별</span>
                    </label>

                    <label class="filter-check">
                        <input type="checkbox" data-dimension="week">
                        <span data-i18n="filterWeek">주별</span>
                    </label>

                    <label class="filter-check">
                        <input type="checkbox" data-dimension="month">
                        <span data-i18n="filterMonth">월별</span>
                    </label>

                </div>

                <div class="filter-group">

                    <span class="filter-label" data-i18n="filterMeasureLabel">집계 값</span>

                    <!-- 집계 값은 하나만 고른다 (수량 합계 / 출고 건수 / 이상 알림 건수) -->
                    <label class="filter-check">
                        <input type="radio" name="measure" value="qty" checked>
                        <span data-i18n="filterQty">수량</span>
                    </label>

                    <label class="filter-check">
                        <input type="radio" name="measure" value="count">
                        <span data-i18n="filterCount">출고 건수</span>
                    </label>

                    <!-- 이상 알림은 관리자에게만 보인다 (analytics.js 가 관리자 확인 후 표시) -->
                    <label class="filter-check" hidden>
                        <input type="radio" name="measure" value="abnormal">
                        <span data-i18n="filterAbnormal">이상 알림</span>
                    </label>

                </div>

            </div>


            <section class="card table-card chart-card">

                <div id="analyticsEmpty" class="empty" hidden>
                    <i class="fa-solid fa-chart-column"></i>
                    <span id="analyticsEmptyText">표시할 출고 데이터가 없습니다.</span>
                </div>

                <div id="analyticsChartScroll" class="chart-scroll">
                    <div id="analyticsChartBox" class="chart-box">
                        <canvas id="analyticsChart"></canvas>
                    </div>
                </div>

            </section>


            <section class="card table-card analytics-table-card">

                <table id="analyticsTable">
                    <thead>
                        <tr id="analyticsTableHead"></tr>
                    </thead>
                    <tbody id="analyticsTableBody"></tbody>
                </table>

            </section>

        </main>

    </div>

    <script src="../js/common.js"></script>
    <script src="../js/analytics.js"></script>

</body>

</html>
