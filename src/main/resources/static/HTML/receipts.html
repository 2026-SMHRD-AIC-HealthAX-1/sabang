<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<title>Fram Vision - 전표 관리</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link rel="stylesheet" href="../CSS/style.css">

</head>


<body data-page="receipts">

<div id="header"></div>

<div class="layout">

<div id="sidebar"></div>


<main class="main">


<div class="page-header">

<h1>
📄 전표 관리
</h1>

<p>
의약품 입·출고 전표를 등록하고 OCR을 통해 자동으로 인식합니다.
</p>

<br>

<button>
+ 전표 등록
</button>

</div>


<div class="content-grid">

<div class="card info-card">

<i class="fa-solid fa-file-lines"></i>

<h3>전체 전표</h3>

<div class="number">
0건
</div>

</div>


<div class="card info-card">

<i class="fa-solid fa-circle-check"></i>

<h3>매칭 완료</h3>

<div class="number">
0건
</div>

</div>


<div class="card info-card">

<i class="fa-solid fa-triangle-exclamation"></i>

<h3>오류 전표</h3>

<div class="number">
0건
</div>

</div>

</div>


<section class="card table-card">

<div class="card-title">

<i class="fa-solid fa-list"></i>

전표 목록

</div>

<table>

<thead>

<tr>

<th>전표번호</th>
<th>일자</th>
<th>구분</th>
<th>병동</th>
<th>의약품 수</th>
<th>담당자</th>
<th>상태</th>
<th>작업</th>

</tr>

</thead>

</table>


<div class="empty">

<i class="fa-regular fa-folder-open"></i>

등록된 전표가 없습니다.

</div>

</section>


</main>

</div>


<script src="../js/common.js"></script>

</body>

</html>
