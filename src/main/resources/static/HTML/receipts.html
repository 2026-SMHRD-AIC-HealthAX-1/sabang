<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fram Vision - 전표 관리</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../CSS/style.css">
<link rel="stylesheet" href="../CSS/receipts.css">
</head>
<body data-page="receipts">
<div id="header"></div>
<div class="layout">
    <div id="sidebar"></div>
    <main class="main">
        <!-- <div class="page-header">
            <h1 data-i18n="receiptsTitle">전표 관리</h1>
            <p data-i18n="receiptsDescription">의약품 입·출고 전표와 OCR 인식 결과를 확인합니다.</p>
        </div> -->
        <div class="receipts-grid">
            <section class="card receipt-list" aria-labelledby="receipt-list-title">
                <h2 class="card-title" id="receipt-list-title"><i class="fa-solid fa-list" aria-hidden="true"></i> <span data-i18n="receiptListTitle">전표 목록</span></h2>
                <div class="receipt-table-scroll">
                    <table class="receipt-table">
                        <thead><tr><th scope="col" data-i18n="colReceiptNo">전표번호</th><th scope="col" data-i18n="colDate">일자</th><th scope="col" data-i18n="colType">구분</th><th scope="col" data-i18n="colWard">병동</th><th scope="col" data-i18n="colMedicineCount">의약품 수</th><th scope="col" data-i18n="colStaff">담당자</th><th scope="col" data-i18n="colAction">작업</th></tr></thead>
                        <tbody id="receiptTableBody"><tr><td class="table-loading-row" colspan="7" data-i18n="loadingLabel">불러오는 중...</td></tr></tbody>
                    </table>
                </div>
            </section>
            <div class="receipt-details" id="receipt-details" tabindex="-1" role="region" aria-label="선택한 전표 상세">
                <section class="card receipt-image-card" aria-labelledby="receipt-image-title">
                    <h2 class="card-title" id="receipt-image-title"><i class="fa-solid fa-camera" aria-hidden="true"></i> <span data-i18n="receiptImageTitle">촬영한 전표 이미지</span></h2>
                    <figure>
                        <div class="receipt-image-area">
                            <div class="receipt-image-crop"><img id="receiptImage" src="" alt="" width="1617" height="836"></div>
                        </div>
                        <figcaption id="receiptCaption"></figcaption>
                    </figure>
                </section>
                <section class="card receipt-ocr-card" aria-labelledby="receipt-ocr-title">
                    <h2 class="card-title" id="receipt-ocr-title"><i class="fa-solid fa-file-lines" aria-hidden="true"></i> <span data-i18n="receiptOcrTitle">OCR 인식 결과</span></h2>
                    <p class="ocr-note" id="ocr-note" data-i18n="receiptOcrNote">전표 이미지를 OCR로 인식한 결과입니다.</p>
                    <table class="receipt-ocr-table" aria-labelledby="receipt-ocr-title" aria-describedby="ocr-note">
                        <thead><tr><th scope="col" data-i18n="colMedicineName">의약품명</th><th scope="col" data-i18n="ocrColRequestQty">요청수량</th><th scope="col" data-i18n="ocrColOutboundQty">실제 반출</th></tr></thead>
                        <tbody id="ocrTableBody"></tbody>
                    </table>
                </section>
            </div>
        </div>
    </main>
</div>
<script src="../js/common.js"></script>
<script src="../js/receipts.js"></script>
</body>
</html>
