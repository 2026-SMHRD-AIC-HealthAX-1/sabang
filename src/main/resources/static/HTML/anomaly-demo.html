<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>이상 알림 동작 확인</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body>

    <main style="max-width:720px;margin:60px auto;padding:24px">

        <h1>이상 알림 동작 확인</h1>

        <p style="margin:20px 0">
            실제 탐지와 별개인 예시 데이터입니다. 버튼을 누를 때마다 새로운 예시 출고 건을 만듭니다.
        </p>

        <button id="demo" style="padding:12px">승압제 전표 3개 / 탐지 2개 발생</button>

        <p id="result" role="status" style="margin:20px 0"></p>

        <a href="dashboard.html">대시보드 보기 →</a> ·
        <a href="alerts.html">이상 알림 보기 →</a>

    </main>

    <script src="../js/anomaly-store.js"></script>
    <script>
        document.getElementById('demo').onclick = () => {

            try {

                const id = crypto.randomUUID();

                FramAnomalies.record({
                    eventId: id,
                    receiptId: 'DEMO-' + id.slice(0, 8),
                    drugId: 'demo-vasopressor',
                    drugName: '승압제',
                    expectedQuantity: 3,
                    detectedQuantity: 2,
                    finalized: true
                });

                document.getElementById('result').textContent =
                    '예시 알림이 저장되었습니다. 대시보드 상단과 이상 알림 목록에서 확인하세요.';

            } catch (error) {

                document.getElementById('result').textContent =
                    '저장하지 못했습니다: ' + error.message;
            }
        };
    </script>

</body>
</html>
