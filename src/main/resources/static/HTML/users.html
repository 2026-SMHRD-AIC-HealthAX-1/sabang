<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>관리자페이지</title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    >

    <!-- 공통 CSS -->
    <link rel="stylesheet" href="../CSS/style.css">

    <link rel="stylesheet" href="../CSS/users.css">

    <script src="../js/admin-guard.js"></script>

</head>


<body data-page="users">


    <!-- 공통 헤더 -->
    <div id="header"></div>



    <div class="layout">


        <!-- 공통 사이드바 -->
        <div id="sidebar"></div>



        <main class="main">


            <!-- 페이지 제목 -->
            <!-- <div class="page-header">

                <h1 data-i18n="usersPageTitle">
                    👤 사용자 관리
                </h1>

                <p data-i18n="usersPageDescription">
                    약품관리 시스템을 사용하는 담당자를 관리합니다.
                </p>

            </div> -->



            <!-- ==================================================
                 사용자 관리 콘텐츠
            ================================================== -->

            <div class="users-content">



                <!-- ==================================================
                     왼쪽 : 사용자 목록
                ================================================== -->

                <section
                    class="card table-card"
                    aria-labelledby="users-title"
                >


                    <h2
                        class="card-title"
                        id="users-title"
                    >

                        <i
                            class="fa-solid fa-users"
                            aria-hidden="true"
                        ></i>

                        <span data-i18n="userListTitle">사용자 목록</span>

                    </h2>



                    <div class="users-table-wrapper">


                        <table>


                            <thead>

                                <tr>

                                    <th scope="col" data-i18n="colUserId">
                                        사용자 ID
                                    </th>

                                    <th scope="col" data-i18n="colName">
                                        이름
                                    </th>

                                    <th scope="col" data-i18n="colEmail">
                                        이메일
                                    </th>

                                    <th scope="col" data-i18n="colDepartment">
                                        소속
                                    </th>

                                    <th scope="col" data-i18n="colRole">
                                        권한
                                    </th>

                                    <th scope="col" data-i18n="colStatus">
                                        상태
                                    </th>

                                </tr>

                            </thead>



                            <tbody id="userTableBody">
                                <tr>
                                    <td class="table-loading-row" colspan="6" data-i18n="loadingLabel">불러오는 중...</td>
                                </tr>
                            </tbody>


                        </table>


                    </div>


                </section>




                <!-- ==================================================
                     오른쪽 : 사용자 추가
                ================================================== -->

                <section
                    class="card user-add-card"
                    aria-labelledby="user-add-title"
                >


                    <h2
                        class="card-title"
                        id="user-add-title"
                    >

                        <i
                            class="fa-solid fa-user-plus"
                            aria-hidden="true"
                        ></i>

                        <span data-i18n="userAddTitle">사용자 추가</span>

                    </h2>



                    <div class="user-add-body">


                        <p class="user-add-description" data-i18n="userAddDescription">

                            시스템에 회원가입한 사용자의 아이디를 검색한 뒤
                            사용자 목록에 추가할 수 있습니다.

                        </p>



                        <!-- 검색 영역 -->

                        <div class="search-box">


                            <input
                                type="text"
                                id="userSearchInput"
                                placeholder="사용자 아이디를 입력하세요"
                                data-i18n-placeholder="searchIdPlaceholder"
                                autocomplete="off"
                            >


                            <button
                                type="button"
                                class="search-btn"
                                id="searchUserBtn"
                            >

                                <i
                                    class="fa-solid fa-magnifying-glass"
                                ></i>

                                <span data-i18n="searchBtn">검색</span>

                            </button>


                        </div>



                        <!-- ==================================================
                             검색 성공
                        ================================================== -->

                        <div
                            class="search-result"
                            id="searchResult"
                        >


                            <div class="result-user">


                                <!-- 사용자 아이콘 -->

                                <div class="user-icon">

                                    <i
                                        class="fa-solid fa-user"
                                    ></i>

                                </div>



                                <!-- 사용자 정보 -->

                                <div class="result-info">


                                    <div
                                        class="result-name"
                                        id="resultName"
                                    >
                                    </div>


                                    <div
                                        class="result-email"
                                        id="resultEmail"
                                    >
                                    </div>


                                </div>


                            </div>



                            <!-- 사용자 추가 -->

                            <button
                                type="button"
                                class="add-user-btn"
                                id="addUserBtn"
                            >

                                <i
                                    class="fa-solid fa-user-plus"
                                ></i>

                                <span data-i18n="addToListBtn">사용자 목록에 추가</span>

                            </button>


                        </div>



                        <!-- ==================================================
                             검색 실패
                        ================================================== -->

                        <div
                            class="search-message"
                            id="searchMessage"
                            data-i18n="searchNotFoundMessage"
                        >

                            회원가입된 사용자를 찾을 수 없습니다.

                        </div>


                    </div>


                </section>


            </div>


            <!-- ==================================================
                 구역(Zone) 설정
            ================================================== -->

            <section class="card zone-card" aria-labelledby="zone-title">

                <h2 class="card-title" id="zone-title">
                    <i class="fa-solid fa-vector-square" aria-hidden="true"></i>
                    <span data-i18n="zoneConfigTitle">구역(Zone) 설정</span>
                </h2>

                <div class="zone-body">

                    <!-- 왼쪽: 카메라 화면 + 구역 오버레이 -->
                    <div class="zone-camera-area">

                        <div class="zone-camera-toolbar">

                            <button type="button" id="zoneCameraPrevBtn" class="zone-camera-switch-btn">
                                <i class="fa-solid fa-chevron-left"></i>
                            </button>

                            <span id="zoneCameraName" class="zone-camera-name" data-i18n="noCameraLabel" hidden></span>

                            <button type="button" id="zoneCameraNextBtn" class="zone-camera-switch-btn">
                                <i class="fa-solid fa-chevron-right"></i>
                            </button>

                        </div>

                        <div id="zoneCameraContainer" class="zone-camera-container">

                            <div id="zoneCameraLoading" class="zone-camera-empty" data-i18n="loadingLabel">불러오는 중...</div>

                            <img id="zoneCameraVideo" class="zone-camera-video" alt="카메라 화면" hidden>

                            <div id="zoneCameraEmpty" class="zone-camera-empty" data-i18n="noCameraRegisteredMessage" hidden></div>

                        </div>

                    </div>


                    <!-- 오른쪽: 의약품(구역) 목록 관리 -->
                    <div class="zone-list-area">

                        <ul id="zoneList" class="zone-list"></ul>

                        <button type="button" id="zoneAddBtn" class="zone-add-btn">
                            <i class="fa-solid fa-plus"></i>
                            <span data-i18n="addMedicineBtn">약품추가</span>
                        </button>

                        <button type="button" id="zoneSaveBtn" class="zone-save-btn" data-i18n="saveBtn">
                            저장
                        </button>

                        <p id="zoneMessage" class="zone-message"></p>

                    </div>

                </div>

            </section>


            <!-- ==================================================
                 병동 관리
            ================================================== -->

            <section class="card ward-card" aria-labelledby="ward-title">

                <h2 class="card-title" id="ward-title">
                    <i class="fa-solid fa-hospital" aria-hidden="true"></i>
                    <span data-i18n="wardManageTitle">병동 관리</span>
                </h2>

                <div class="ward-table-wrapper">

                    <table>

                        <thead>
                            <tr>
                                <th scope="col" data-i18n="colWardId">병동번호</th>
                                <th scope="col" data-i18n="colWardName">병동명</th>
                                <th scope="col" data-i18n="colLocation">위치</th>
                                <th scope="col" data-i18n="colAction">작업</th>
                            </tr>
                        </thead>

                        <tbody id="wardTableBody">
                            <tr>
                                <td class="table-loading-row" colspan="4" data-i18n="loadingLabel">불러오는 중...</td>
                            </tr>
                        </tbody>

                    </table>

                </div>

                <form id="wardAddForm" class="ward-add-row">

                    <input type="text" id="wardIdInput" placeholder="예: 7병동" data-i18n-placeholder="wardIdPlaceholder" autocomplete="off" required>
                    <input type="text" id="wardNameInput" placeholder="병동명" data-i18n-placeholder="wardNamePlaceholder" autocomplete="off" required>
                    <input type="text" id="wardLocationInput" placeholder="위치 (선택)" data-i18n-placeholder="locationPlaceholder" autocomplete="off">

                    <button type="submit" class="ward-add-btn">
                        <i class="fa-solid fa-plus"></i>
                        <span data-i18n="addWardBtn">병동 추가</span>
                    </button>

                </form>

                <p id="wardFormMessage" class="ward-form-message"></p>

            </section>


        </main>


        <!-- 약품 추가/수정 모달 -->
        <div id="medicineFormModal" class="zone-modal" hidden>

            <div class="zone-modal-backdrop" id="medicineModalBackdrop"></div>

            <div class="zone-modal-box">

                <h2 id="medicineModalTitle" data-i18n="addMedicineModalTitle">약품 추가</h2>

                <form id="medicineForm">

                    <label for="medicineNameInput" data-i18n="colMedicineName">의약품명</label>
                    <input type="text" id="medicineNameInput" required>

                    <label for="medicineHighRiskInput" data-i18n="highRiskLabel">고위험군 여부</label>
                    <select id="medicineHighRiskInput">
                        <option value="N" data-i18n="riskNormal">일반</option>
                        <option value="Y" data-i18n="riskHigh">고위험</option>
                    </select>

                    <label for="medicineManufacturerInput" data-i18n="manufacturerLabel">제조사</label>
                    <input type="text" id="medicineManufacturerInput" required>

                    <label for="medicineRegisterDateInput" data-i18n="registerDateLabel">등록일자</label>
                    <input type="date" id="medicineRegisterDateInput" required>

                    <label for="medicineMinQtyInput" data-i18n="minQtyLabel">최소 수량</label>
                    <input type="number" id="medicineMinQtyInput" min="0" step="1" inputmode="numeric">
                    <p class="zone-modal-hint" data-i18n="minQtyHint">재고가 이 수량 이하로 떨어지면 알림이 갑니다. 비워두면 이 약품은 재고 부족 알림이 생성되지 않습니다.</p>

                    <div class="zone-modal-actions">
                        <button type="button" id="medicineModalCancelBtn" class="zone-modal-cancel-btn" data-i18n="cancelBtn">취소</button>
                        <button type="submit" class="zone-modal-submit-btn" data-i18n="saveBtn">저장</button>
                    </div>

                    <p id="medicineFormMessage" class="zone-modal-message"></p>

                </form>

            </div>

        </div>


    </div>



    <!-- 공통 JS -->
    <script src="../js/common.js"></script>



    <script src="../js/users.js"></script>
    <script src="../js/ward-ui.js"></script>

    <script src="../js/zone-store.js"></script>
    <script src="../js/zone-ui.js"></script>


</body>

</html>
