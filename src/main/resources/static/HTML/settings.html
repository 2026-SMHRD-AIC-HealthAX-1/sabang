<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fram Vision - 설정</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="../CSS/style.css">

    <link rel="stylesheet" href="../CSS/settings.css">
</head>


<body data-page="settings">

<div id="header"></div>


<div class="layout">

    <div id="sidebar"></div>


    <main class="main">

        <!-- 페이지 제목 -->
        <!-- <div class="page-header">

            <h1 data-i18n="settingsTitle">
                ⚙ 설정
            </h1>

            <p data-i18n="settingsDescription">
                Fram Vision 시스템 환경을 설정합니다.
            </p>

        </div> -->


        <!-- 설정 카드 -->
        <section class="card settings-card">

            <div class="settings-title">

                <i class="fa-solid fa-sliders"></i>

                <span data-i18n="environmentSettings">
                    환경 설정
                </span>

            </div>


            <!-- 글자 크기 -->
            <div class="setting-item">

                <div class="setting-info">

                    <div class="setting-icon">
                        <i class="fa-solid fa-font"></i>
                    </div>

                    <div>

                        <h3 data-i18n="fontSize">
                            글자 크기
                        </h3>

                        <p data-i18n="fontSizeDescription">
                            화면에 표시되는 글자의 크기를 설정합니다.
                        </p>

                    </div>

                </div>


                <select id="fontSizeSetting"
                        class="setting-select">

                    <option value="small">
                        작게
                    </option>

                    <option value="normal">
                        기본
                    </option>

                    <option value="large">
                        크게
                    </option>

                </select>

            </div>


            <!-- 다크모드 -->
            <div class="setting-item">

                <div class="setting-info">

                    <div class="setting-icon">
                        <i class="fa-solid fa-moon"></i>
                    </div>

                    <div>

                        <h3 data-i18n="darkMode">
                            화면 모드
                        </h3>

                        <p data-i18n="darkModeDescription">
                            밝은 화면 또는 어두운 화면을 선택합니다.
                        </p>

                    </div>

                </div>


                <select id="themeSetting"
                        class="setting-select">

                    <option value="light">
                        라이트 모드
                    </option>

                    <option value="dark">
                        다크 모드
                    </option>

                </select>

            </div>


            <!-- 언어 -->
            <div class="setting-item">

                <div class="setting-info">

                    <div class="setting-icon">
                        <i class="fa-solid fa-language"></i>
                    </div>

                    <div>

                        <h3 data-i18n="language">
                            언어
                        </h3>

                        <p data-i18n="languageDescription">
                            시스템에서 사용할 언어를 선택합니다.
                        </p>

                    </div>

                </div>


                <select id="languageSetting"
                        class="setting-select">

                    <option value="ko">
                        한국어
                    </option>

                    <option value="en">
                        English
                    </option>

                </select>

            </div>


            <!-- 알림 -->
            <div class="setting-item">

                <div class="setting-info">

                    <div class="setting-icon">
                        <i class="fa-solid fa-bell"></i>
                    </div>

                    <div>

                        <h3 data-i18n="notificationSetting">
                            알림 설정
                        </h3>

                        <p data-i18n="notificationDescription">
                            이상 감지 시 알림을 표시합니다.
                        </p>

                    </div>

                </div>


                <label class="switch">

                    <input type="checkbox"
                           id="notificationSetting"
                           checked>

                    <span class="slider"></span>

                </label>

            </div>


            <!-- 저장 버튼 -->
            <div class="settings-button-area">

                <button id="saveSettings"
                        class="save-settings-btn">

                    <i class="fa-solid fa-check"></i>

                    <span data-i18n="saveSettings">
                        설정 저장
                    </span>

                </button>

            </div>


            <!-- 저장 완료 메시지 -->
            <div id="saveMessage"
                 class="save-message">

                <i class="fa-solid fa-circle-check"></i>

                <span data-i18n="saveComplete">
                    설정이 저장되었습니다.
                </span>

            </div>

        </section>

    </main>

</div>


<script src="../js/common.js"></script>


<script src="../js/settings.js"></script>

</body>

</html>
